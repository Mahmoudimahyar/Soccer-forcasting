<text x="24" y="438" font-size="11" fill="#57606a">B1 Elo = ternary-Elo model with no fitted parameters; market = no-vig bookmaker consensus; M3&#8211;M5 = fixed, untuned blends of the two. RPS = ranked</text>
<text x="24" y="452.5" font-size="11" fill="#57606a">probability score (lower is better). Intervals: match-level percentile bootstrap, 5,000 resamples, fixture = unit of analysis. Across all metrics in the source table,</text>
<text x="24" y="467" font-size="11" fill="#57606a">none of the 24 reported paired differences has an interval that excludes zero. Forecast-quality metrics only &#8211; research, not betting advice.</text>
<text x="24" y="483.5" font-size="11" fill="#57606a">Source: notes/research/PROSPECTIVE_SHADOW_SCORECARD_V1.md (paired fixture-level deltas, RPS rows); lead time from</text>
