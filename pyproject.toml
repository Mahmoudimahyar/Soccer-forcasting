[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wcdrawlab"
version = "0.2.0"
description = "World Cup probabilistic prediction, research, and guarded Kalshi execution lab"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "requests>=2.31",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
wcdrawlab = "wcdrawlab.cli:main"
