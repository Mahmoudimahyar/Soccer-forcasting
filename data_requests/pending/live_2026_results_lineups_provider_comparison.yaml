recommendation:
  preferred: "API-Football Pro (~$25-30/mo) — cheapest path that unlocks 2026 live fixtures/lineups/
              events/standings AND reuses the EXISTING adapter unchanged (just a plan upgrade)."
  low_cost_fallback: "football-data.org (free, already integrated) for results/standings — closes the
                      RESULTS gap at $0; pair with TheSportsDB Patreon (~$3-9/mo) ONLY if cheap
                      lineup/event coverage is needed and its quality is accepted (verify first)."
  not_recommended_now: "SportMonks (fine but redundant w/ API-Football); Sportradar/Opta (enterprise overkill)."
user_action_required:
  - "If live 2026 lineups/events are wanted: approve an API-Football Pro upgrade (~$25-30/mo)."
  - "Otherwise: no purchase — results/standings already free via football-data.org."
