# Durable <=10h HIERARCHICAL CROSS-DOMAIN TRANSFER research run (reuses deep_research_supervisor.py).
# research_only / experimental / not_runtime_approved / not_trade_eligible / not_live_eligible.
# OFFLINE: verified LOCAL data only (international event lake + club auxiliary manifest + the already-
# materialised domain-normalized transfer dataset). NO API-Football, NO Odds API, NO StatsBomb network,
# NO scrape, NO credentials. NEVER touches the active collector (worldcup_draw_model_lab_FINAL /
# WorldCupShadowCollector), B1, frozen M1-M5, candidate.py, approved_models.yaml, trading/Kalshi/risk,
# or .env. paper-only. The REFERENCE for every candidate comparison is research.transfer.w2_reference_t0.
run:
  max_hours: 10.0
  max_workers: 2
  max_api_requests: 100000000          # offline; the budget gate is structurally never hit
  heartbeat_interval_s: 120
  collector_heartbeat: "C:/Users/Mahyar/worldcup_draw_model_lab_FINAL/outputs/live_shadow/collector_heartbeat.json"
  collector_stale_seconds: 100000      # the collector is an independent system; never block on its cadence
  per_job_timeout_s: 36000
safety:
  kalshi_live_trading: false
  trading_mode: paper
  use_odds_api: false
  use_api_football: false
  no_external_api: true
  labels: "research_only/experimental/not_runtime_approved/not_trade_eligible/not_live_eligible"
jobs:
  - {id: JOB1,  title: "deps + isolation + worktree + test-baseline + dry-run", script: "scripts/ht_jobs/ht_job01_preflight.py", critical: true}
  - {id: JOB2,  title: "domain inventory + contract", script: "scripts/ht_jobs/ht_job02_domain_inventory.py", critical: true}
  - {id: JOB3,  title: "feature-overlap / domain-shift audit", script: "scripts/ht_jobs/ht_job03_feature_overlap.py", critical: false}
  - {id: JOB4,  title: "freeze feature-stability registry", script: "scripts/ht_jobs/ht_job04_feature_stability.py", critical: false}
  - {id: JOB5,  title: "fold-specific domain-normalized transfer datasets", script: "scripts/ht_jobs/ht_job05_transfer_datasets.py", critical: true}
  - {id: JOB6,  title: "fit T0-T7 ladder (train rows only)", script: "scripts/ht_jobs/ht_job06_fit_ladder.py", critical: false}
  - {id: JOB7,  title: "primary forward-chain international eval", script: "scripts/ht_jobs/ht_job07_forward_chain.py", critical: false}
  - {id: JOB8,  title: "leave-one-competition-out (LOCO) eval", script: "scripts/ht_jobs/ht_job08_loco.py", critical: false}
  - {id: JOB9,  title: "transfer-coverage / overlap / fallback audit", script: "scripts/ht_jobs/ht_job09_coverage_audit.py", critical: false}
  - {id: JOB10, title: "ablations + club-family removal", script: "scripts/ht_jobs/ht_job10_ablations.py", critical: false}
  - {id: JOB11, title: "calibration + match-bootstrap + reliability + domain-shift diagnostics", script: "scripts/ht_jobs/ht_job11_calibration_bootstrap.py", critical: false}
  - {id: JOB12, title: "failure analysis", script: "scripts/ht_jobs/ht_job12_failure_analysis.py", critical: false}
  - {id: JOB13, title: "model registry + feature-stability registry + decision ledger", script: "scripts/ht_jobs/ht_job13_registry_ledger.py", critical: false}
  - {id: JOB14, title: "scientific report + final integrity audit", script: "scripts/ht_jobs/ht_job14_report_integrity.py", critical: true}
