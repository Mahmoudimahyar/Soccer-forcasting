<title id="fig-title">How many matches would it take? Match-clustered power to detect an RPS improvement</title>
<desc id="fig-desc">Power against number of matches on a log axis for 6 absolute RPS gains. With the 231 matches available, power for a 0.005 gain is 0.28.</desc>
<rect x="0.5" y="0.5" width="899" height="512" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
