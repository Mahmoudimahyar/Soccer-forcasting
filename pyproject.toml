[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wcdrawlab"
version = "0.3.0"
description = "World Cup probabilistic forecasting research lab: leakage-tested data, a fixed evaluator, in-play models, and a prospectively scored 2026 shadow evaluation (paper-only)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mahmoudimahyar" }]
requires-python = ">=3.10"
keywords = ["football", "soccer", "world-cup", "probabilistic-forecasting", "calibration", "elo", "poisson", "prospective-evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "requests>=2.31",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
data = ["duckdb>=1.0"]                                  # one exploratory squad-feature script
commentary = ["SoccerNet", "huggingface_hub"]           # commentary-NLP acquisition scripts only

[project.urls]
Homepage = "https://github.com/Mahmoudimahyar/Soccer-forcasting"
Documentation = "https://github.com/Mahmoudimahyar/Soccer-forcasting/tree/main/docs"
Issues = "https://github.com/Mahmoudimahyar/Soccer-forcasting/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
wcdrawlab = "wcdrawlab.cli:main"
