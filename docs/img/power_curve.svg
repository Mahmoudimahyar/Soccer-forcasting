<text x="24" y="451" font-size="11" fill="#57606a">Dashed lines only join committed values: a visual guide, not simulated curves. Gains of 0.002 or smaller never reached 0.60 power on the grid (up to 2,000</text>
<text x="24" y="465.5" font-size="11" fill="#57606a">matches). Each value is one Monte-Carlo estimate: 5 repeats at 231 matches ranged 0.215&#8211;0.300 for the 0.005 gain. 139 matches = the 60%-coverage scenario.</text>
<text x="24" y="482" font-size="11" fill="#57606a">Source: data/reference/international_event_lake_power_analysis.json (400 simulated datasets &#215; 400 bootstrap resamples per estimate; grid sizes from</text>
