<text x="24" y="53" font-size="12.5" fill="#57606a">Noise template: the per-match paired RPS differences actually observed on the 231 eligible internationals (5 tournaments; event-process</text>
<text x="24" y="70" font-size="12.5" fill="#57606a">model e7 minus the e2 remaining-time Poisson reference), centred to zero, SD 0.059. The independent unit is the match, not the in-play</text>
<text x="24" y="87" font-size="12.5" fill="#57606a">snapshot: every simulated dataset is resampled by match. &quot;Detect&quot; = the match-level bootstrap 95% interval lies wholly below zero.</text>
