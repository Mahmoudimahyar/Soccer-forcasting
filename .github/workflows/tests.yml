name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Developed on Windows / Python 3.13. All three configurations were observed green on
          # 2026-09-20 (py3.13 resolves pandas 3.x; py3.10 resolves pandas 2.x), so all are required.
          - { os: windows-latest, python: "3.13", experimental: false }
          - { os: ubuntu-latest, python: "3.13", experimental: false }
          - { os: ubuntu-latest, python: "3.10", experimental: false }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e . --no-deps
      # Hard gate: .env.example must contain placeholders only (exits 1 on a suspected secret).
      - run: python scripts/check_secret_hygiene.py
      # -rs prints every skip reason, so the data-dependent skips are visible rather than hidden.
      - run: python -m pytest tests -q -rs --strict-markers -p no:cacheprovider
